# The build (Compose + Hilt + Room via KSP + the FFmpegKit AAR + instrumented tests) outgrew 3 GB.
# Raise these only as far as the machine allows; the emulator and Android Studio need RAM too.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# The Kotlin compiler (and KSP) run in their own daemon with their own heap.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
