# Every push and pull request: JVM unit tests, Android lint and a minified release build (signed with the debug key so
# R8 problems surface here, not on a phone). Instrumented tests need an arm64 device (FFmpegKit is arm64-only), so they
# run on demand on a device farm instead — see docs/RELEASE.md.
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Robolectric needs JDK 21 to run tests against SDK 36; the app itself still compiles for JVM 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease -PreleaseWithDebugKey

      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "The build changed app/schemas: commit the Room schema files."; git status --porcelain -- app/schemas; exit 1
          fi

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
